<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="greeting-section">
      <h1 id="greeting">Hello!</h1>
      <p class="clock" id="clock">--:--</p>
      <p class="date" id="date">Loading…</p>
    </div>

    <div class="topbar-actions">
      <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle light/dark mode">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="dashboard">
    <!-- Focus Timer -->
    <section class="card focus-timer" aria-label="Focus timer">
      <h2>Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-status" id="timer-status">Ready to focus</div>
      <div class="timer-controls">
        <button id="start-btn" class="btn btn-primary">Start</button>
        <button id="stop-btn" class="btn" disabled>Stop</button>
        <button id="reset-btn" class="btn">Reset</button>
      </div>
      <div class="timer-settings">
        <label for="timer-minutes">Minutes</label>
        <input type="number" id="timer-minutes" min="1" max="90" value="25" />
        <button id="set-timer-btn" class="btn btn-small">Set</button>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card todo-list" aria-label="To-do list">
      <h2>To-Do List</h2>
      <form class="todo-input" id="todo-form">
        <input type="text" id="todo-input" placeholder="Add a new task…" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <ul class="todo-items" id="todo-items"></ul>
      <p class="empty-hint" id="todo-empty">No tasks yet — add one above.</p>
    </section>

    <!-- Quick Links -->
    <section class="card quick-links" aria-label="Quick links">
      <h2>Quick Links</h2>
      <form class="link-input" id="link-form">
        <input type="text" id="link-name" placeholder="Name (e.g. GitHub)" autocomplete="off" />
        <input type="url" id="link-url" placeholder="https://…" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <div class="links-grid" id="links-container"></div>
      <p class="empty-hint" id="links-empty">No links saved yet.</p>
    </section>
  </main>

  <!-- Settings -->
  <footer class="footer">
    <div class="settings-card">
      <h2>Settings</h2>
      <div class="setting-row">
        <label for="name-input">Your name</label>
        <input type="text" id="name-input" placeholder="Enter your name" autocomplete="off" />
      </div>
      <p class="settings-hint">Your name appears in the greeting. Settings are saved automatically.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
